---
layout: default
---
<style>
  .post-header { margin-bottom: 3rem; }

  .post-meta {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.2rem;
    flex-wrap: wrap;
  }

  .post-date {
    font-size: 0.85rem;
    color: var(--muted);
  }

  .post-tag {
    background: rgba(0,229,160,0.1);
    border: 1px solid rgba(0,229,160,0.2);
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 500;
    padding: 0.2rem 0.8rem;
    border-radius: 100px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .post-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 900;
    line-height: 1.2;
    background: linear-gradient(135deg, #fff 0%, #a0ffe0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 1rem;
  }

  .post-subtitle {
    font-size: 1.1rem;
    color: var(--muted);
    font-weight: 300;
  }

  .divider {
    width: 60px;
    height: 3px;
    background: linear-gradient(90deg, #00e5a0, #00c9ff);
    border-radius: 10px;
    margin: 2rem 0;
  }

  .post-content h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--text);
    margin: 2.5rem 0 1rem;
  }

  .post-content h3 {
    font-size: 1.15rem;
    font-weight: 500;
    color: var(--accent);
    margin: 2rem 0 0.75rem;
  }

  .post-content p { margin-bottom: 1.25rem; color: #c8e0d8; }

  .post-content a { color: var(--accent); text-decoration: underline; }

  .post-content ul, .post-content ol {
    margin: 0 0 1.25rem 1.5rem;
    color: #c8e0d8;
  }

  .post-content li { margin-bottom: 0.4rem; }

  .post-content code {
    background: rgba(0,229,160,0.08);
    border: 1px solid rgba(0,229,160,0.15);
    border-radius: 4px;
    padding: 0.15em 0.5em;
    font-size: 0.88em;
    color: var(--accent);
  }

  .post-content pre {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    overflow-x: auto;
    margin-bottom: 1.5rem;
  }

  .post-content pre code {
    background: none;
    border: none;
    padding: 0;
    color: var(--text);
    font-size: 0.9rem;
  }

  .post-content blockquote {
    border-left: 3px solid var(--accent);
    padding-left: 1.2rem;
    margin: 1.5rem 0;
    color: var(--muted);
    font-style: italic;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.9rem;
    margin-bottom: 2.5rem;
    transition: color 0.2s;
  }

  .back-link:hover { color: var(--accent); }
</style>

<a href="/blog" class="back-link"><i class="fas fa-arrow-left"></i> All posts</a>

<div class="post-header">
  <div class="post-meta">
    <span class="post-date">{{ page.date | date: "%B %d, %Y" }}</span>
    {% if page.tags %}
      {% for tag in page.tags %}
        <span class="post-tag">{{ tag }}</span>
      {% endfor %}
    {% endif %}
  </div>
  <h1 class="post-title">{{ page.title }}</h1>
  {% if page.subtitle %}<p class="post-subtitle">{{ page.subtitle }}</p>{% endif %}
  <div class="divider"></div>
</div>

<div class="post-content">
  {{ content }}
</div>
