<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ page.title }} — Ankit Pratap Singh</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  {% seo %}
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0f0c;
      --accent: #00e5a0;
      --accent2: #00c9ff;
      --text: #e8f5f0;
      --muted: #7a9e8e;
      --card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      line-height: 1.7;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.08;
      pointer-events: none;
      z-index: 0;
    }
    .blob1 { width: 500px; height: 500px; background: #00e5a0; top: -100px; left: -100px; }
    .blob2 { width: 400px; height: 400px; background: #00c9ff; bottom: -100px; right: -100px; }

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,15,12,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    nav .logo {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text);
      text-decoration: none;
    }

    nav .logo span { color: var(--accent); }

    nav .nav-links { display: flex; gap: 2rem; }

    nav .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    nav .nav-links a:hover, nav .nav-links a.active { color: var(--accent); }

    main {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
    }

    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <nav>
    <a href="/" class="logo">Ankit<span>.</span></a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/blog" class="{% if page.url contains '/blog' %}active{% endif %}">Blog</a>
      <a href="https://github.com/pratapcommits" target="_blank"><i class="fab fa-github"></i></a>
      <a href="https://www.linkedin.com/in/ankit-singh-b52035159/" target="_blank"><i class="fab fa-linkedin-in"></i></a>
    </div>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>Built by <a href="/">Ankit Pratap Singh</a> · <a href="/blog">Blog</a></p>
  </footer>
</body>
</html>
